<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLens — Medical Image Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0f0f1a;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #1a1a2e;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #00d4ff;
        }

        .logo span { color: #ff6b9d; }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .hero p {
            color: #8888aa;
            font-size: 18px;
        }

        .upload-section {
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .upload-box {
            background: #1a1a2e;
            border: 2px dashed #2a2a4a;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-box:hover {
            border-color: #00d4ff;
            background: #1a1a3e;
        }

        .upload-icon { font-size: 48px; margin-bottom: 16px; }

        .upload-box p { color: #8888aa; margin-bottom: 20px; }

        .upload-btn {
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .upload-btn:hover { opacity: 0.8; }

        #file-input { display: none; }

        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff6b9d, #ff4466);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            display: none;
            transition: opacity 0.3s;
        }

        .analyze-btn:hover { opacity: 0.8; }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a2a4a;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: none;
        }

        .results h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 32px;
            color: #00d4ff;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .image-card {
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a4a;
        }

        .image-card img {
            width: 100%;
            display: block;
        }

        .image-card .label {
            padding: 12px;
            text-align: center;
            font-weight: 600;
            color: #8888aa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2a2a4a;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            color: #8888aa;
            margin-top: 4px;
            font-size: 14px;
        }

        .tumor-alert {
            background: linear-gradient(135deg, #ff4444, #ff6b9d);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 600;
        }

        .normal-alert {
            background: linear-gradient(135deg, #00aa44, #00d4ff);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">Medi<span>Lens</span> 🔬</div>
</nav>

<div class="hero">
    <h1>Medical Image Analysis</h1>
    <p>Upload a DICOM scan for AI-powered tumor detection</p>
</div>

<div class="upload-section">
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">🫁</div>
        <p>Drop your DICOM file here or click to browse</p>
        <button class="upload-btn">Choose File</button>
        <input type="file" id="file-input" accept=".dcm" onchange="fileSelected(this)">
    </div>
    <p id="file-name" style="text-align:center; margin-top:12px; color:#00d4ff;"></p>
    <button class="analyze-btn" id="analyze-btn" onclick="analyze()">
        🔬 Analyze Scan
    </button>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color:#8888aa;">Analyzing scan with AI...</p>
</div>

<div class="results" id="results">
    <h2>Analysis Results</h2>
    <div id="alert-box"></div>
    <div class="images-grid">
        <div class="image-card">
            <img id="original-img" src="">
            <div class="label">Original CT Scan</div>
        </div>
        <div class="image-card">
            <img id="mask-img" src="">
            <div class="label">Tumor Detection</div>
        </div>
        <div class="image-card">
            <img id="overlay-img" src="">
            <div class="label">Overlay</div>
        </div>
    </div>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="modality">-</div>
            <div class="stat-label">Modality</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="tumor-pct">-</div>
            <div class="stat-label">Anomaly Coverage %</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="dimensions">-</div>
            <div class="stat-label">Image Dimensions</div>
        </div>
    </div>
</div>

<script>
    let selectedFile = null;

    function fileSelected(input) {
        selectedFile = input.files[0];
        document.getElementById('file-name').textContent = '✅ ' + selectedFile.name;
        document.getElementById('analyze-btn').style.display = 'block';
    }

    async function analyze() {
        if (!selectedFile) return;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').style.display = 'none';
        document.getElementById('analyze-btn').style.display = 'none';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            document.getElementById('loading').style.display = 'none';

            if (data.error) {
                alert('Error: ' + data.error);
                return;
            }

            document.getElementById('original-img').src = 'data:image/png;base64,' + data.original;
            document.getElementById('mask-img').src = 'data:image/png;base64,' + data.mask;
            document.getElementById('overlay-img').src = 'data:image/png;base64,' + data.overlay;
            document.getElementById('modality').textContent = data.metadata.modality;
            document.getElementById('tumor-pct').textContent = data.metadata.tumor_percentage + '%';
            document.getElementById('dimensions').textContent = data.metadata.rows + 'x' + data.metadata.columns;

            const alertBox = document.getElementById('alert-box');
            if (data.metadata.tumor_percentage > 1) {
                alertBox.innerHTML = '<div class="tumor-alert">⚠️ Anomalies Detected — ' + data.metadata.tumor_percentage + '% of scan area flagged</div>';
            } else {
                alertBox.innerHTML = '<div class="normal-alert">✅ No significant anomalies detected</div>';
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('analyze-btn').style.display = 'block';

        } catch (err) {
            document.getElementById('loading').style.display = 'none';
            alert('Error: ' + err.message);
        }
    }
</script>

</body>
</html>
